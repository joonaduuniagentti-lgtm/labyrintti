<!DOCTYPE html>
<html lang="fi">
<head><meta charset="utf-8"><title>Mekot</title></head>
<body style="margin:0;background:#f3efff;font-family:system-ui">
<!-- Kehitystyökalu: näyttää kaikki mekot (edestä, sivulta, takaa ja kuvakkeena). -->
<canvas id="c"></canvas>
<script type="module">
  import { drawLeia, drawDressIcon } from '../js/sprites.js';
  import { DRESSES } from '../js/dresses.js';
  const cols = 4, cw = 300, ch = 190;
  const c = document.getElementById('c');
  const rows = Math.ceil(DRESSES.length / cols);
  const dpr = 2;
  c.width = cols * cw * dpr; c.height = rows * ch * dpr;
  c.style.width = cols * cw + 'px'; c.style.height = rows * ch + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  DRESSES.forEach((d, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.fillStyle = i % 2 ? '#ffffff' : '#faf7ff';
    ctx.fillRect(x, y, cw, ch);
    drawLeia(ctx, x + 60, y + 85, 110, { t: 0.4, outfit: d });
    drawLeia(ctx, x + 145, y + 95, 70, { t: 0.4, outfit: d, facing: 'right', walking: true, walkT: 0.1 });
    drawLeia(ctx, x + 205, y + 95, 70, { t: 0.4, outfit: d, facing: 'up' });
    drawLeia(ctx, x + 262, y + 100, 44, { t: 0.4, outfit: d, happy: true });
    drawDressIcon(ctx, x + 262, y + 40, 40, d, 0.4);
    ctx.fillStyle = '#3d2f7a';
    ctx.font = '700 14px system-ui';
    ctx.fillText(`${d.name} · ${d.price}`, x + 10, y + ch - 12);
  });
  window.ready = true;
</script>
</body>
</html>
